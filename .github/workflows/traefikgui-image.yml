name: Build traefikgui Image

# Baut das Multi-Arch-Image (linux/amd64 + linux/arm64) der Traefik Log GUI und legt es
# in die DigitalOcean-Registry. Der Tag kommt aus app/VERSION; existiert er bereits,
# wird nichts gebaut. Flux (ImagePolicy "traefikgui") rollt neue Tags automatisch aus.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - clusters/digitalocean/apps/traefikgui/app/**
      - .github/workflows/traefikgui-image.yml

env:
  IMAGE: registry.digitalocean.com/datenschleuder/traefikgui
  APP_DIR: clusters/digitalocean/apps/traefikgui/app

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.APP_DIR }}/go.mod
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum

      - name: Tests
        working-directory: ${{ env.APP_DIR }}
        run: |
          go vet ./...
          go test -race ./...

      - name: Version lesen
        id: version
        working-directory: ${{ env.APP_DIR }}
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_REGISTRY_USER }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Prüfen, ob der Tag schon existiert
        id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "Image $IMAGE:${{ steps.version.outputs.version }} existiert bereits - VERSION erhöhen, um neu zu bauen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Multi-Arch-Image bauen und pushen
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          push: true
