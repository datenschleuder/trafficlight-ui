# Macht https://www.yourdomain.tld/trafficlight/dashboard/ auf traefikgui (Service
# "traefikgui", Port 8080, Namespace "monitoring") erreichbar - geschuetzt per
# Basic Auth. Alle Pfade der GUI sind relativ, sie funktioniert daher hinter dem
# Pfad-Praefix (Trailing-Slash-Redirect + StripPrefix).
#
# Traefik beobachtet CRDs im Namespace "monitoring" per
# --providers.kubernetescrd.namespaces (infrastructure/traefik/traefikDeployment.yml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute-trafficlight-dashboard
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: >-
        (Host(`www.yourdomain.tld`) || Host(`yourdomain.tld`)) && (Path(`/trafficlight/dashboard`) || PathPrefix(`/trafficlight/dashboard/`))
      priority: 1000
      middlewares:
        - name: security-headers
          namespace: default
        - name: custom-server-header
          namespace: default
        - name: trafficlight-dashboard-add-trailing-slash
        - name: trafficlight-dashboard-strip-prefix
      services:
        - name: traefikgui
          port: 8080
  tls:
    options:
      name: mytlsoption
      namespace: default
